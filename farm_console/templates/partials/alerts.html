<section class="panel pad stack" style="gap: 12px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h2>Needs attention</h2>
    <span class="small muted">{{ vm.alerts | length }} open</span>
  </div>
  {%- for a in vm.alerts %}
  <div class="alert">
    <span class="badge {{ a.tone }}">{{ a.kind }}</span>
    <span class="text">{{ a.text }}</span>
    <a href="{{ a.href }}">{{ a.action }}</a>
  </div>
  {%- else %}
  <div class="empty">Nothing needs you. Every managed market is quoting, and no naked budget is used up.</div>
  {%- endfor %}
</section>
