<section class="panel pad-table">
  <div class="head"><h2>Snapshots</h2></div>
  {%- if snapshots %}
  <div class="scroll">
    <table class="tbl">
      <thead><tr><th>Taken at</th><th>Note</th><th>Orders</th></tr></thead>
      <tbody>
        {%- for s in snapshots %}
        <tr><td class="mono"><a href="/orders/snapshots/{{ s.id }}">{{ s.taken_at | stamp_local }}</a></td><td class="wrap">{{ s.note }}{% if s.source %}<span class="muted">imported from {{ s.source }}</span>{% endif %}</td><td class="mono">{{ '{:,}'.format(s.orders) }}</td></tr>
        {%- endfor %}
      </tbody>
    </table>
  </div>
  {%- else %}
  <div class="empty" style="margin: 0 18px 12px">No snapshots yet.</div>
  {%- endif %}
</section>
